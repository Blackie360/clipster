[package]
name = "clipster-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "clipster picker window"

[dependencies]
clipster-core.workspace = true
anyhow.workspace = true
clap.workspace = true

# Default features drag in accesskit and eframe's persistence layer, neither
# of which a window that lives for three seconds has any use for. Keeping
# them off is worth a few MB of binary and a slice of the startup budget.
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
